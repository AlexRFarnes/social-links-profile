<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Social links profile</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <article class="card">
        <img src="./assets/images/avatar-jessica.jpeg" alt="Portrait of Jessica Randall" class="card__image" />
        <header class="card__header">
          <h1 class="card__title">Jessica Randall</h1>
          <p class="card__subtitle">London, United Kingdom</p>
        </header>

        <p class="card__description-text">"Front-end developer and avid reader."</p>

        <nav aria-label="Social links" class="card__social-links">
          <ul class="card__social-links-list">
            <li class="card__social-links-item"><a href="#" class="card__social-links-link">GitHub</a></li>
            <li class="card__social-links-item"><a href="#" class="card__social-links-link">Frontend Mentor</a></li>
            <li class="card__social-links-item"><a href="#" class="card__social-links-link">LinkedIn</a></li>
            <li class="card__social-links-item"><a href="#" class="card__social-links-link">Twitter</a></li>
            <li class="card__social-links-item"><a href="#" class="card__social-links-link">Instagram</a></li>
          </ul>
        </nav>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>
      . Coded by
      <a href="https://github.com/AlexRFarnes">Alex R. Farnes</a>
      .
    </footer>
  </body>
</html>
